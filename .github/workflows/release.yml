name: Build Windows release

# Push a tag like v1.2.0 to build MediaGrab-Setup.exe and publish it as a GitHub release.
# Installed copies of MediaGrab see the new release and update themselves.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = (Select-String -Path mediagrab.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value }
          (Get-Content mediagrab.py) -replace '^VERSION = ".*"', "VERSION = `"$v`"" | Set-Content mediagrab.py -Encoding utf8
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build MediaGrab.exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MediaGrab --icon mediagrab.ico --add-data "mediagrab.ico;." mediagrab.py

      - name: Get yt-dlp and ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bin/yt-dlp.exe
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Get-ChildItem ffmpeg -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bin

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Zip browser extension
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath MediaGrab-extension.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/MediaGrab-Setup.exe
            dist/MediaGrab.exe
            MediaGrab-extension.zip
          body: |
            **Download `MediaGrab-Setup.exe`** and run it. Already installed? MediaGrab updates itself.
            `MediaGrab.exe` is the portable version (downloads yt-dlp and ffmpeg on first start).

      - name: Keep build files (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-windows
          path: |
            Output/MediaGrab-Setup.exe
            dist/MediaGrab.exe

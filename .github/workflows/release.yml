name: Build Windows release

# Change VERSION in mediagrab.py and push to main: this builds MediaGrab-Setup.exe and
# publishes it as release v<VERSION>. Installed copies of MediaGrab then update themselves.
on:
  push:
    branches: [main]
    paths: ["mediagrab.py", "extension/**", "installer.iss", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path mediagrab.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" -R "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Build MediaGrab.exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MediaGrab --icon mediagrab.ico --add-data "mediagrab.ico;." mediagrab.py

      - name: Get yt-dlp and ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bin/yt-dlp.exe
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Get-ChildItem ffmpeg -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bin

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Zip browser extension
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath MediaGrab-extension.zip

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $notes = "**Download MediaGrab-Setup.exe** and run it. Already installed? MediaGrab updates itself.`n`nMediaGrab.exe is the portable version (downloads yt-dlp and ffmpeg on first start). MediaGrab-extension.zip is the browser extension (it is also installed with the app)."
          gh release create "v$v" Output/MediaGrab-Setup.exe dist/MediaGrab.exe MediaGrab-extension.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "MediaGrab $v" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Keep build files (version already released)
        if: steps.ver.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-windows
          path: |
            Output/MediaGrab-Setup.exe
            dist/MediaGrab.exe
